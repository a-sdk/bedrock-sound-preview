<head>
<meta charset="utf-8">

<title>Minecraft Bedrock Sound Preview</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e2e2e6;
    --card: #f5f5f7; --accent: #2f8f46; --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --fg: #ececf0; --muted: #9a9aa3; --line: #2c2d31;
      --card: #202226; --accent: #3fae5a; --accent-fg: #0b130d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select {
    font: inherit; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  input { flex: 1 1 200px; min-width: 0; }
  select { flex: 0 1 180px; max-width: 100%; }
  #count { font-size: 13px; color: var(--muted); margin-top: 8px; }
  main { padding: 6px 14px 30px; max-width: 800px; margin: 0 auto; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .info { flex: 1; min-width: 0; }
  .dir { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  button {
    font: inherit; border: 0; border-radius: 8px; cursor: pointer;
    padding: 10px 14px; min-width: 44px; min-height: 44px;
  }
  .play { background: var(--accent); color: var(--accent-fg); }
  .copy { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  #more { display: block; margin: 16px auto; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { font-size: 12px; color: var(--muted); padding: 0 14px 30px; max-width: 800px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>Minecraft Bedrock Sound Preview</h1>

  </div>
  <div id="count"></div>
</header>
<main>
  <div id="list"></div>
  <button id="more" hidden>Show more</button>
</main>
<footer>

</footer>

const PAGE = 100;

const items = FILES.map(([p, secs]) => {
  const parts = p.split("/");
  const file = parts.pop();
  const name = file.replace(/\.mp3$/i, "");
  const dir = parts.join("/");
  // top folder below "sounds/" (or "(root)")

const qEl = document.getElementById("q");
const folderEl = document.getElementById("folder");
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const moreEl = document.getElementById("more");

[...new Set(items.map(i => i.top))].sort().forEach(t => {
  const o = document.createElement("option");
  o.value = t; o.textContent = t;
  folderEl.appendChild(o);
});

const audio = new Audio();
audio.preload = "none";
let playingBtn = null, playingPath = null;

function resetPlayBtn() {
  if (playingBtn) playingBtn.textContent = "\u25B6";
  playingBtn = null; playingPath = null;
}
audio.addEventListener("ended", resetPlayBtn);
audio.addEventListener("error", resetPlayBtn);

function togglePlay(item, btn) {
  if (playingPath === item.path && !audio.paused) {
    audio.pause(); resetPlayBtn(); return;
  }
  resetPlayBtn();
  audio.src = encodeURI(item.path);
  audio.play().then(() => {
    playingBtn = btn; playingPath = item.path; btn.textContent = "\u23F8";
  }).catch(() => resetPlayBtn());
}

function copyText(text, btn) {
  const done = () => {
    const old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  document.body.removeChild(ta);
}

let filtered = [], shown = 0;

function fmtDur(s) {
  if (s == null) return "";
  if (s < 60) return " \u00B7 " + s.toFixed(1) + " s";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  return " \u00B7 " + m + ":" + String(r).padStart(2, "0");
}

function makeRow(item) {
  const row = document.createElement("div");
  row.className = "row";

  const info = document.createElement("div");
  info.className = "info";
  const dir = document.createElement("div");
  dir.className = "dir"; dir.textContent = item.dir + "/" + fmtDur(item.secs);
  const name = document.createElement("div");
  name.className = "name"; name.textContent = item.name;
  info.append(dir, name);

  const play = document.createElement("button");
  play.className = "play"; play.textContent = "\u25B6";
  play.setAttribute("aria-label", "Play " + item.name);
  play.addEventListener("click", () => togglePlay(item, play));

  const copy = document.createElement("button");
  copy.className = "copy"; copy.textContent = "Copy";
  copy.setAttribute("aria-label", "Copy path of " + item.name);
  copy.addEventListener("click", () => copyText(item.dir + "/" + item.name, copy));

  row.append(info, play, copy);
  return row;
}

function renderMore() {
  const next = filtered.slice(shown, shown + PAGE);
  next.forEach(i => listEl.appendChild(makeRow(i)));
  shown += next.length;
  moreEl.hidden = shown >= filtered.length;
}

  const terms = qEl.value.toLowerCase().split(/\s+/).filter(Boolean);
  const top = folderEl.value;
  filtered = items.filter(i =>
    (!top || i.top === top) && terms.every(t => i.key.includes(t))
  );
  audio.pause(); resetPlayBtn();
  listEl.innerHTML = ""; shown = 0;
  countEl.textContent = filtered.length + " of " + items.length + " sounds";
  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty">No sounds found.</div>';
    moreEl.hidden = true;
    return;
  }
  renderMore();
}

let timer = null;
qEl.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(applyFilter, 150); });
folderEl.addEventListener("change", applyFilter);
moreEl.addEventListener("click", renderMore);
applyFilter();
</script>
</body>
</html>
